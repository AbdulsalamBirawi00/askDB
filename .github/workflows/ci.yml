name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checks:
    name: Lint, typecheck, unit, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: askdb
          POSTGRES_PASSWORD: askdb
          POSTGRES_DB: askdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U askdb -d askdb"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://askdb:askdb@localhost:5432/askdb
      # Tests connect to the Postgres service on localhost.
      ALLOW_PRIVATE_DB_HOSTS: "true"
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Throwaway secrets for this run only; never stored anywhere.
      - name: Generate test secrets
        run: |
          echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "CONNECTION_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "NORTHWIND_READONLY_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - name: Migrate database
        run: pnpm db:migrate

      - name: Load Northwind and seed the demo connection
        run: |
          pnpm db:northwind
          pnpm db:seed-demo

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm --filter @askdb/web exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
